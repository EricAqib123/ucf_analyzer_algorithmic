name: Extract RAR and Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      # ---------------------------------------------
      # 2. Install unrar and Git LFS
      # ---------------------------------------------
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar
          git lfs install

      # ---------------------------------------------
      # 3. Find original RAR
      # ---------------------------------------------
      - name: Find RAR file
        shell: bash
        run: |
          RAR_FILE=$(find . -type f -iname "*.rar" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$RAR_FILE" ]; then
            echo "ERROR: No RAR file found!"
            exit 1
          fi

          echo "Found RAR:"
          echo "$RAR_FILE"

          echo "RAR_FILE=$RAR_FILE" >> "$GITHUB_ENV"

      # ---------------------------------------------
      # 4. Extract RAR
      # ---------------------------------------------
      - name: Extract RAR
        run: |
          rm -rf extracted
          mkdir -p extracted

          echo "Extracting $RAR_FILE..."

          unrar x -o+ "$RAR_FILE" extracted/

      # ---------------------------------------------
      # 5. Remove nested Git metadata
      # ---------------------------------------------
      - name: Remove nested Git metadata
        run: |
          echo "Removing nested Git metadata..."

          find extracted \
            -type d \
            -name ".git" \
            -prune \
            -exec rm -rf {} +

          find extracted \
            -type f \
            -name ".gitmodules" \
            -delete

          find extracted \
            -type f \
            -name ".git" \
            -delete

      # ---------------------------------------------
      # 6. Find large files and configure Git LFS
      # ---------------------------------------------
      - name: Configure Git LFS for large files
        shell: bash
        run: |
          echo "Finding files larger than 90 MB..."

          find extracted -type f -size +90M -print

          while IFS= read -r file; do
            echo "Adding to Git LFS: $file"
            git lfs track "$file"
          done < <(find extracted -type f -size +90M)

      # ---------------------------------------------
      # 7. Check extracted files
      # ---------------------------------------------
      - name: Check extracted files
        run: |
          echo "================================"
          echo "EXTRACTED SIZE"
          echo "================================"

          du -sh extracted

          echo ""
          echo "================================"
          echo "LARGE FILES"
          echo "================================"

          find extracted -type f -size +90M -exec ls -lh {} \;

          echo ""
          echo "================================"
          echo "GIT LFS TRACKED FILES"
          echo "================================"

          cat .gitattributes || true

      # ---------------------------------------------
      # 8. Configure Git
      # ---------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------
      # 9. Add files
      # ---------------------------------------------
      - name: Add extracted files
        run: |
          git add .gitattributes
          git add -A extracted/

          echo "================================"
          echo "GIT STATUS"
          echo "================================"

          git status --short

      # ---------------------------------------------
      # 10. Commit
      # ---------------------------------------------
      - name: Commit changes
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract RAR files"
          fi

      # ---------------------------------------------
      # 11. Push Git LFS files
      # ---------------------------------------------
      - name: Push Git LFS files
        run: |
          git lfs push origin main --all

      # ---------------------------------------------
      # 12. Push Git repository
      # ---------------------------------------------
      - name: Push repository
        run: |
          git push origin HEAD:main

      # ---------------------------------------------
      # 13. Final check
      # ---------------------------------------------
      - name: Final LFS check
        run: |
          echo "================================"
          echo "LFS FILES"
          echo "================================"

          git lfs ls-files

          echo ""
          echo "================================"
          echo "DONE"
          echo "================================"

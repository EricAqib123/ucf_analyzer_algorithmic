name: Extract RAR

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install unrar
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar

      - name: Extract RAR
        run: |
          mkdir extracted
          unrar x "ucf_analyzer_algorithmic.rar" extracted/

      - name: Show extracted files
        run: |
          ls -lah extracted
